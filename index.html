<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Slow Roads Driving Simulation</title>
  <style>
    :root {
      --hud-bg: rgba(255, 255, 255, 0.15);
      --hud-blur: blur(16px);
      --hud-border: rgba(255, 255, 255, 0.3);
      --text-main: #ffffff;
      --text-sub: rgba(255, 255, 255, 0.7);
    }
    * { box-sizing: border-box; user-select: none; }
    html, body {
      height: 100%; margin: 0; padding: 0;
      overflow: hidden; background: #87ceeb;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    #canvas { width: 100vw; height: 100vh; display: block; }
    
    .glass-panel {
      background: var(--hud-bg);
      backdrop-filter: var(--hud-blur);
      -webkit-backdrop-filter: var(--hud-blur);
      border: 1px solid var(--hud-border);
      border-radius: 16px;
      color: var(--text-main);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.1);
    }

    #hud-main {
      position: absolute;
      top: 24px;
      left: 24px;
      padding: 16px 24px;
      display: flex;
      align-items: baseline;
      gap: 12px;
    }
    #speed { font-size: 48px; font-weight: 700; letter-spacing: -1px; line-height: 1; }
    #unit { font-size: 14px; font-weight: 600; text-transform: uppercase; color: var(--text-sub); }
    #gear { font-size: 18px; font-weight: 600; color: #ffd700; margin-left: 8px; }

    #hud-controls {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      padding: 12px 24px;
      font-size: 13px;
      letter-spacing: 0.5px;
      display: flex;
      gap: 20px;
    }
    .key {
      background: rgba(255,255,255,0.25);
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: 600;
    }

    #hud-settings {
      position: absolute;
      top: 24px;
      right: 24px;
      padding: 8px;
      display: flex;
      gap: 8px;
    }
    .btn-icon {
      background: rgba(255,255,255,0.2);
      border: none;
      color: white;
      padding: 10px 14px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 600;
      font-size: 12px;
      transition: all 0.2s ease;
    }
    .btn-icon:hover { background: rgba(255,255,255,0.4); }
  </style>
</head>
<body>

  <canvas id="canvas"></canvas>

  <div id="hud-main" class="glass-panel">
    <span id="speed">0</span>
    <span id="unit">KM/H</span>
    <span id="gear">D</span>
  </div>

  <div id="hud-controls" class="glass-panel">
    <span><span class="key">W</span> / <span class="key">↑</span> Accelerate</span>
    <span><span class="key">S</span> / <span class="key">↓</span> Brake / Reverse</span>
    <span><span class="key">A</span> <span class="key">D</span> Steer</span>
    <span><span class="key">Space</span> Handbrake</span>
    <span><span class="key">R</span> Reset</span>
  </div>

  <div id="hud-settings" class="glass-panel">
    <button class="btn-icon" id="time-btn">☀️ Day</button>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/simplex-noise@2.4.0/simplex-noise.min.js"></script>

  <script>
    // --- NOISE GENERATOR ---
    const simplex = new SimplexNoise();
    function noise2D(x, y) { return simplex.noise2D(x, y); }

    // --- MATHEMATICAL ROAD & TERRAIN SYSTEM ---
    function getRawTerrainHeight(x, z) {
      let elevation = noise2D(x * 0.002, z * 0.002) * 40;
      elevation += noise2D(x * 0.008, z * 0.008) * 12;
      elevation += noise2D(x * 0.02, z * 0.02) * 2;
      return elevation;
    }

    function getRoadPath(z) {
      const x = Math.sin(z * 0.008) * 60 + Math.sin(z * 0.02) * 20;
      return { x };
    }

    function getExactHeight(x, z) {
      const roadInfo = getRoadPath(z);
      const distToRoad = Math.abs(x - roadInfo.x);
      const terrainH = getRawTerrainHeight(x, z);
      const roadH = getRawTerrainHeight(roadInfo.x, z);

      const roadWidth = 9;
      const blendWidth = 14;

      if (distToRoad < roadWidth) {
        return roadH;
      } else if (distToRoad < roadWidth + blendWidth) {
        const factor = THREE.MathUtils.smoothstep(distToRoad, roadWidth, roadWidth + blendWidth);
        return THREE.MathUtils.lerp(roadH, terrainH, factor);
      }
      return terrainH;
    }

    // --- THREE.JS INITIALIZATION ---
    const canvas = document.getElementById('canvas');
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: "high-performance" });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;

    const scene = new THREE.Scene();
    const skyColor = new THREE.Color(0x91caff);
    scene.background = skyColor;
    scene.fog = new THREE.FogExp2(skyColor, 0.0035);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.5, 1000);

    // --- LIGHTING ---
    const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444455, 0.75);
    scene.add(hemiLight);

    const sun = new THREE.DirectionalLight(0xfff5e6, 1.2);
    sun.position.set(150, 200, 100);
    sun.castShadow = true;
    sun.shadow.mapSize.width = 2048;
    sun.shadow.mapSize.height = 2048;
    sun.shadow.camera.near = 0.5;
    sun.shadow.camera.far = 500;
    const d = 100;
    sun.shadow.camera.left = -d;
    sun.shadow.camera.right = d;
    sun.shadow.camera.top = d;
    sun.shadow.camera.bottom = -d;
    scene.add(sun);

    // --- INFINITE CHUNK SYSTEM ---
    const CHUNK_SIZE = 200;
    const CHUNK_SEGMENTS = 50;
    const VISIBILITY = 4;
    const activeChunks = new Map();

    const terrainMat = new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.9, flatShading: true });
    const roadMat = new THREE.MeshStandardMaterial({ color: 0x2b2b32, roughness: 0.5, metalness: 0.1 });

    function buildChunk(cx, cz) {
      const group = new THREE.Group();
      const geo = new THREE.PlaneGeometry(CHUNK_SIZE, CHUNK_SIZE, CHUNK_SEGMENTS, CHUNK_SEGMENTS);
      geo.rotateX(-Math.PI / 2);

      const pos = geo.attributes.position;
      const colors = [];
      const worldXOffset = cx * CHUNK_SIZE;
      const worldZOffset = cz * CHUNK_SIZE;

      for (let i = 0; i < pos.count; i++) {
        const wx = pos.getX(i) + worldXOffset;
        const wz = pos.getZ(i) + worldZOffset;

        const h = getExactHeight(wx, wz);
        pos.setY(i, h);

        const col = new THREE.Color();
        if (h < 5) col.setHSL(0.12, 0.4, 0.65);
        else if (h < 30) col.setHSL(0.28 + Math.random() * 0.03, 0.5, 0.42);
        else col.setHSL(0.25, 0.3, 0.35);

        colors.push(col.r, col.g, col.b);
      }

      geo.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
      geo.computeVertexNormals();

      const terrainMesh = new THREE.Mesh(geo, terrainMat);
      terrainMesh.position.set(worldXOffset, 0, worldZOffset);
      terrainMesh.receiveShadow = true;
      group.add(terrainMesh);

      // --- ROAD RIBBON MESH ---
      const roadGeo = new THREE.PlaneGeometry(12, CHUNK_SIZE, 2, CHUNK_SEGMENTS);
      roadGeo.rotateX(-Math.PI / 2);
      const rPos = roadGeo.attributes.position;

      for (let i = 0; i < rPos.count; i++) {
        const wz = rPos.getZ(i) + worldZOffset;
        const roadInfo = getRoadPath(wz);
        const rx = rPos.getX(i);

        rPos.setX(i, roadInfo.x + rx);
        rPos.setY(i, getExactHeight(roadInfo.x + rx, wz) + 0.08);
      }
      roadGeo.computeVertexNormals();

      const roadMesh = new THREE.Mesh(roadGeo, roadMat);
      roadMesh.position.set(0, 0, worldZOffset);
      roadMesh.receiveShadow = true;
      group.add(roadMesh);

      populateDecorations(group, worldXOffset, worldZOffset);

      scene.add(group);
      return group;
    }

    function populateDecorations(group, worldX, worldZ) {
      const treeGeo = new THREE.ConeGeometry(2.5, 7, 5);
      const trunkGeo = new THREE.CylinderGeometry(0.4, 0.5, 2, 5);
      const leafMat = new THREE.MeshLambertMaterial({ color: 0x2e6f40, flatShading: true });
      const trunkMat = new THREE.MeshLambertMaterial({ color: 0x5a3d28, flatShading: true });

      for (let i = 0; i < 16; i++) {
        const lx = (Math.random() - 0.5) * CHUNK_SIZE;
        const lz = (Math.random() - 0.5) * CHUNK_SIZE;
        const wx = worldX + lx;
        const wz = worldZ + lz;

        const roadInfo = getRoadPath(wz);
        if (Math.abs(wx - roadInfo.x) < 15) continue;

        const wy = getExactHeight(wx, wz);
        if (wy < 2) continue;

        const tree = new THREE.Group();
        const trunk = new THREE.Mesh(trunkGeo, trunkMat);
        trunk.position.y = 1;
        trunk.castShadow = true;

        const leaves = new THREE.Mesh(treeGeo, leafMat);
        leaves.position.y = 4.5;
        leaves.castShadow = true;

        tree.add(trunk, leaves);
        tree.position.set(wx, wy, wz);

        const s = 0.7 + Math.random() * 0.6;
        tree.scale.set(s, s, s);
        group.add(tree);
      }
    }

    function updateChunks(playerZ) {
      const currentCZ = Math.floor(playerZ / CHUNK_SIZE);
      const activeKeys = new Set();

      for (let cz = currentCZ - 1; cz <= currentCZ + VISIBILITY; cz++) {
        for (let cx = -1; cx <= 1; cx++) {
          const key = `${cx},${cz}`;
          activeKeys.add(key);
          if (!activeChunks.has(key)) {
            activeChunks.set(key, buildChunk(cx, cz));
          }
        }
      }

      for (const [key, chunk] of activeChunks.entries()) {
        if (!activeKeys.has(key)) {
          scene.remove(chunk);
          chunk.traverse(c => { if (c.geometry) c.geometry.dispose(); });
          activeChunks.delete(key);
        }
      }
    }

    // --- CAR VEHICLE CREATION (FIXED ROTATIONAL ANCHORS) ---
    function createVehicle() {
      const car = new THREE.Group();

      const bodyMat = new THREE.MeshStandardMaterial({ color: 0x2a75d3, roughness: 0.3, metalness: 0.4 });
      const glassMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.1, metalness: 0.9, transparent: true, opacity: 0.8 });
      const wheelMat = new THREE.MeshStandardMaterial({ color: 0x1a1a1a, roughness: 0.8 });
      const hubMat = new THREE.MeshStandardMaterial({ color: 0xdddddd, roughness: 0.3 });

      // Body offset elevated to match wheel radius (0.4m)
      const body = new THREE.Mesh(new THREE.BoxGeometry(1.9, 0.7, 4.2), bodyMat);
      body.position.y = 0.75;
      body.castShadow = true;
      car.add(body);

      const cabin = new THREE.Mesh(new THREE.BoxGeometry(1.5, 0.55, 2.2), glassMat);
      cabin.position.set(0, 1.3, -0.2);
      cabin.castShadow = true;
      car.add(cabin);

      // Wheel geometries with clean local pivot orientation
      const wheelGeo = new THREE.CylinderGeometry(0.4, 0.4, 0.3, 16);
      wheelGeo.rotateZ(Math.PI / 2); // Cylinder now points correctly outward along X-axis

      const wheels = [];
      const wheelPivots = [];

      const offsets = [
        [-0.95, 0.4, 1.3],  // Front Left
        [0.95, 0.4, 1.3],   // Front Right
        [-0.95, 0.4, -1.3], // Rear Left
        [0.95, 0.4, -1.3]   // Rear Right
      ];

      offsets.forEach(([x, y, z]) => {
        // Individual pivot group eliminates 24/7 wheel wobble
        const pivot = new THREE.Group();
        pivot.position.set(x, y, z);

        const w = new THREE.Mesh(wheelGeo, wheelMat);
        w.castShadow = true;

        const hub = new THREE.Mesh(new THREE.BoxGeometry(0.32, 0.1, 0.5), hubMat);
        hub.position.x = x > 0 ? 0.02 : -0.02;
        w.add(hub);

        pivot.add(w);
        car.add(pivot);

        wheels.push(w);
        wheelPivots.push(pivot);
      });

      scene.add(car);
      return { mesh: car, wheels, wheelPivots, body, wheelOffsets: offsets };
    }

    const vehicle = createVehicle();

    // --- CAR PHYSICS & EXACT GROUND ALIGNMENT ---
    const state = {
      x: 0, z: 0, speed: 0, heading: 0,
      steering: 0, maxSpeed: 45, accel: 18,
      decel: 12, friction: 5, brake: 32,
      smoothY: 0,
      pitch: 0, roll: 0
    };

    const keys = {};
    window.addEventListener('keydown', e => { keys[e.code] = true; if (e.code === 'KeyR') resetPlayer(); });
    window.addEventListener('keyup', e => { keys[e.code] = false; });

    function resetPlayer() {
      state.z += 10;
      const road = getRoadPath(state.z);
      state.x = road.x;
      state.speed = 0;
      state.heading = 0;
    }

    function updatePhysics(dt) {
      const throttle = keys['KeyW'] || keys['ArrowUp'];
      const braking = keys['KeyS'] || keys['ArrowDown'];
      const steerLeft = keys['KeyA'] || keys['ArrowLeft'];
      const steerRight = keys['KeyD'] || keys['ArrowRight'];
      const handbrake = keys['Space'];

      if (throttle) {
        state.speed = Math.min(state.maxSpeed, state.speed + state.accel * dt);
      } else if (braking) {
        state.speed = Math.max(-12, state.speed - state.brake * dt);
      } else {
        if (state.speed > 0) state.speed = Math.max(0, state.speed - state.friction * dt);
        if (state.speed < 0) state.speed = Math.min(0, state.speed + state.friction * dt);
      }

      if (handbrake) {
        state.speed = THREE.MathUtils.lerp(state.speed, 0, dt * 4);
      }

      const steerTarget = (steerLeft ? 1 : 0) - (steerRight ? 1 : 0);
      state.steering = THREE.MathUtils.lerp(state.steering, steerTarget, dt * 8);

      const turnFactor = state.steering * (0.65 + 0.35 * (1 - Math.abs(state.speed) / state.maxSpeed));
      state.heading += turnFactor * (state.speed / 14) * dt;

      state.x += Math.sin(state.heading) * state.speed * dt;
      state.z += Math.cos(state.heading) * state.speed * dt;

      // --- ACCURATE WHEEL HEIGHT & TILT SAMPLING ---
      const cosH = Math.cos(state.heading);
      const sinH = Math.sin(state.heading);

      const getWheelWorldPos = (localX, localZ) => {
        const wx = state.x + (localX * cosH + localZ * sinH);
        const wz = state.z + (-localX * sinH + localZ * cosH);
        return { x: wx, z: wz, y: getExactHeight(wx, wz) };
      };

      const fl = getWheelWorldPos(-0.95, 1.3);
      const fr = getWheelWorldPos(0.95, 1.3);
      const rl = getWheelWorldPos(-0.95, -1.3);
      const rr = getWheelWorldPos(0.95, -1.3);

      // Average ground plane height
      const targetY = (fl.y + fr.y + rl.y + rr.y) / 4;
      state.smoothY = THREE.MathUtils.lerp(state.smoothY, targetY, dt * 18);

      // Calculate terrain slope (Pitch) and transverse tilt (Roll)
      const frontY = (fl.y + fr.y) / 2;
      const rearY = (rl.y + rr.y) / 2;
      const targetPitch = Math.atan2(frontY - rearY, 2.6);

      const leftY = (fl.y + rl.y) / 2;
      const rightY = (fr.y + rr.y) / 2;
      const targetRoll = Math.atan2(leftY - rightY, 1.9);

      state.pitch = THREE.MathUtils.lerp(state.pitch, targetPitch, dt * 12);
      state.roll = THREE.MathUtils.lerp(state.roll, targetRoll, dt * 12);

      // Apply Matrix Transformations cleanly in order: Y-heading -> Pitch -> Roll
      vehicle.mesh.position.set(state.x, state.smoothY, state.z);
      vehicle.mesh.rotation.set(0, 0, 0);
      vehicle.mesh.rotation.y = state.heading;
      vehicle.mesh.rotateX(-state.pitch);
      vehicle.mesh.rotateZ(state.roll);

      // Smooth chassis inertia roll
      vehicle.body.rotation.z = THREE.MathUtils.lerp(vehicle.body.rotation.z, -state.steering * state.speed * 0.003, dt * 6);

      // Wheel Spin & Steering (Without Wobble)
      const spinDelta = (state.speed / 0.4) * dt;
      vehicle.wheels.forEach((w, i) => {
        w.rotation.x += spinDelta;
        if (i < 2) {
          vehicle.wheelPivots[i].rotation.y = state.steering * 0.45;
        }
      });

      // Update HUD
      document.getElementById('speed').textContent = Math.abs(Math.round(state.speed * 3.6));
      document.getElementById('gear').textContent = state.speed < -0.1 ? 'R' : 'D';
    }

    // --- SMOOTH CAMERA TRACKING ---
    const cameraTarget = new THREE.Vector3();
    const cameraPosTarget = new THREE.Vector3();

    function updateCamera(dt) {
      const camDistance = 10 + Math.abs(state.speed) * 0.08;
      const camHeight = 3.8 + Math.abs(state.speed) * 0.02;

      const cx = state.x - Math.sin(state.heading) * camDistance;
      const cz = state.z - Math.cos(state.heading) * camDistance;
      const cy = getExactHeight(cx, cz) + camHeight;

      cameraPosTarget.set(cx, Math.max(cy, getExactHeight(cx, cz) + 1.5), cz);
      camera.position.lerp(cameraPosTarget, 1 - Math.exp(-6 * dt));

      cameraTarget.set(
        state.x + Math.sin(state.heading) * 6,
        state.smoothY + 1.2,
        state.z + Math.cos(state.heading) * 6
      );
      camera.lookAt(cameraTarget);
    }

    // --- DAY/NIGHT TOGGLE ---
    let isNight = false;
    document.getElementById('time-btn').addEventListener('click', () => {
      isNight = !isNight;
      document.getElementById('time-btn').textContent = isNight ? '🌙 Night' : '☀️ Day';
      
      const newSky = isNight ? new THREE.Color(0x0a1118) : skyColor;
      scene.background = newSky;
      scene.fog.color = newSky;
      sun.intensity = isNight ? 0.1 : 1.2;
      hemiLight.intensity = isNight ? 0.15 : 0.75;
    });

    // --- MAIN GAME LOOP ---
    let lastTime = performance.now();
    function animate(currentTime) {
      requestAnimationFrame(animate);

      const dt = Math.min(0.05, (currentTime - lastTime) / 1000);
      lastTime = currentTime;

      updatePhysics(dt);
      updateChunks(state.z);
      updateCamera(dt);

      sun.position.z = state.z + 100;

      renderer.render(scene, camera);
    }

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    resetPlayer();
    requestAnimationFrame(animate);
  </script>
</body>
</html>
