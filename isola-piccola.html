<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Isola Piccola</title>
<style>
:root{--pill:rgba(20,30,40,.6);--fg:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--pill:rgba(0,0,0,.6)}}
:root[data-theme="dark"]{--pill:rgba(0,0,0,.6)}
html,body{height:100%;margin:0;background:#9ed0e6;overflow:hidden;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
#c{display:block;width:100%;height:100%}
.p{position:fixed;background:var(--pill);color:var(--fg);padding:8px 14px;border-radius:12px;font-size:15px}
#hud{top:calc(env(safe-area-inset-top,0px) + 10px);left:10px;display:flex;gap:18px}
#help{bottom:calc(env(safe-area-inset-bottom,0px) + 10px);left:10px;font-size:13px;max-width:calc(100% - 40px)}
b{font-size:22px}
</style></head><body>
<canvas id="c"></canvas>
<div class="p" id="hud"><span><b id="spd">0</b> km/h</span><span>Damage <b id="dmg">0</b>%</span></div>
<div class="p" id="help">W / ↑ gas · S / ↓ brake, reverse · A D / ← → steer · Space handbrake · R reset and repair</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const R=(s=>()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296})(7);
const S=700,G=140,C=S/G,HALF=S/2,V=G+1;
const sm=(a,b,x)=>{x=Math.min(1,Math.max(0,(x-a)/(b-a)));return x*x*(3-2*x)};
const cl=(x,a,b)=>Math.max(a,Math.min(b,x));
function base(x,z){const e=1-Math.hypot(x,z)/300,n=3*Math.sin(x*.03)*Math.cos(z*.025)+2*Math.sin(x*.07+z*.05)+1.2*Math.sin(x*.15-z*.11);return 60*Math.pow(Math.max(e,0),1.6)+n*Math.min(1,Math.max(e,0)*4)-2}
// road loop
const N=480,P=[];
for(let i=0;i<N;i++){const a=i/N*Math.PI*2,r=190+35*Math.sin(3*a)+20*Math.sin(5*a+1)+12*Math.sin(7*a);P.push({x:r*Math.cos(a),z:r*Math.sin(a)})}
let H=P.map(p=>Math.max(1.6,base(p.x,p.z)));
for(let k=0;k<6;k++)H=H.map((_,i)=>{let s=0;for(let j=-6;j<=6;j++)s+=H[(i+j+N)%N];return s/13});
const T=P.map((_,i)=>{const a=P[(i+1)%N],b=P[(i-1+N)%N],dx=a.x-b.x,dz=a.z-b.z,l=Math.hypot(dx,dz);return{x:dx/l,z:dz/l}});
let L=0;for(let i=0;i<N;i++){const a=P[i],b=P[(i+1)%N];L+=Math.hypot(b.x-a.x,b.z-a.z)}
function near(x,z){let b=1e12,bi=0;for(let i=0;i<N;i++){const a=P[i].x-x,c=P[i].z-z,d=a*a+c*c;if(d<b){b=d;bi=i}}return{i:bi,d:Math.sqrt(b)}}
function pathAt(u){u=((u%1)+1)%1;const f=u*N,i=f|0,t=f-i,a=P[i],b=P[(i+1)%N],ta=T[i],tb=T[(i+1)%N];let tx=ta.x+(tb.x-ta.x)*t,tz=ta.z+(tb.z-ta.z)*t;const l=Math.hypot(tx,tz);return{x:a.x+(b.x-a.x)*t,z:a.z+(b.z-a.z)*t,tx:tx/l,tz:tz/l}}
// scene
const cv=document.getElementById('c'),ren=new THREE.WebGLRenderer({canvas:cv,antialias:true});
ren.setPixelRatio(Math.min(devicePixelRatio,1.5));
const scene=new THREE.Scene(),SKY=0x9ed0e6;scene.background=new THREE.Color(SKY);scene.fog=new THREE.Fog(SKY,160,650);
const cam=new THREE.PerspectiveCamera(65,1,.5,1500);
scene.add(new THREE.HemisphereLight(0xbfe3ff,0x4a5d3a,.75));
const sun=new THREE.DirectionalLight(0xfff0d0,1.1);sun.position.set(200,300,100);scene.add(sun);
// terrain
const geo=new THREE.PlaneGeometry(S,S,G,G);geo.rotateX(-Math.PI/2);
const pos=geo.attributes.position,grid=new Float32Array(V*V),cols=new Float32Array(V*V*3);
for(let k=0;k<pos.count;k++){
  const x=pos.getX(k),z=pos.getZ(k),n=near(x,z);let h=base(x,z);
  h+=(H[n.i]-.3-h)*(1-sm(6,18,n.d));grid[k]=h;pos.setY(k,h);
  cols.set(h<.9?[.83,.76,.53]:h<24?[.3+R()*.06,.5+R()*.08,.22]:[.5,.47,.44],k*3);
}
geo.setAttribute('color',new THREE.BufferAttribute(cols,3));geo.computeVertexNormals();
scene.add(new THREE.Mesh(geo,new THREE.MeshLambertMaterial({vertexColors:true,flatShading:true})));
function hAt(x,z){const fx=(x+HALF)/C,fz=(z+HALF)/C;if(fx<0||fz<0||fx>=G||fz>=G)return -2;const ix=fx|0,iz=fz|0,tx=fx-ix,tz=fz-iz,g=(a,b)=>grid[(iz+b)*V+ix+a];return(g(0,0)*(1-tx)+g(1,0)*tx)*(1-tz)+(g(0,1)*(1-tx)+g(1,1)*tx)*tz}
const wa=new THREE.Mesh(new THREE.PlaneGeometry(2400,2400).rotateX(-Math.PI/2),new THREE.MeshLambertMaterial({color:0x2b8fc4,transparent:true,opacity:.88}));scene.add(wa);
// road ribbon
{const rp=[],ri=[];
for(let i=0;i<=N;i++){const j=i%N,t=T[j],y=H[j]+.1;rp.push(P[j].x-t.z*6,y,P[j].z+t.x*6,P[j].x+t.z*6,y,P[j].z-t.x*6)}
for(let i=0;i<N;i++){const a=2*i;ri.push(a,a+2,a+1,a+1,a+2,a+3)}
const rg=new THREE.BufferGeometry();rg.setAttribute('position',new THREE.Float32BufferAttribute(rp,3));rg.setIndex(ri);rg.computeVertexNormals();
scene.add(new THREE.Mesh(rg,new THREE.MeshLambertMaterial({color:0x3b3b42,side:THREE.DoubleSide})));}
// trees
{const tm=new THREE.InstancedMesh(new THREE.ConeGeometry(2.2,7,6).translate(0,3.5,0),new THREE.MeshLambertMaterial({color:0x2f6b34,flatShading:true}),260),d=new THREE.Object3D();let c=0;
for(let a=0;a<4000&&c<260;a++){const x=(R()-.5)*600,z=(R()-.5)*600,h=hAt(x,z);if(h<1.6||h>26||near(x,z).d<12)continue;const s=.8+R()*.8;d.position.set(x,h-.3,z);d.scale.set(s,s*(.8+R()*.6),s);d.updateMatrix();tm.setMatrixAt(c++,d.matrix)}
tm.count=c;scene.add(tm);}
// houses
{const bg=new THREE.BoxGeometry(6,4,7),rg=new THREE.ConeGeometry(5.6,3,4),bm=new THREE.MeshLambertMaterial({color:0xf0e2c8,flatShading:true}),rm=new THREE.MeshLambertMaterial({color:0xc4542d,flatShading:true});
for(let k=0;k<16;k++){const i=(k*30+12)%N,t=T[i];for(const s of[1,-1]){const x=P[i].x-t.z*16*s,z=P[i].z+t.x*16*s,h=hAt(x,z);if(h<2)continue;
const b=new THREE.Mesh(bg,bm),r=new THREE.Mesh(rg,rm),hd=Math.atan2(t.x,t.z);b.position.set(x,h+1.7,z);b.rotation.y=hd;r.position.set(x,h+5.2,z);r.rotation.y=hd+Math.PI/4;scene.add(b,r);break}}}
// cars
function mkCar(o){const g=new THREE.Group(),m=new THREE.MeshLambertMaterial({color:o.c,flatShading:true});
const body=new THREE.Mesh(new THREE.BoxGeometry(o.w,o.h,o.l,3,2,5),m);body.position.y=.55+o.h/2;g.add(body);
const cab=new THREE.Mesh(new THREE.BoxGeometry(o.w*.85,o.ch,o.l*o.cl),new THREE.MeshLambertMaterial({color:0x22303c,flatShading:true}));cab.position.set(0,.55+o.h+o.ch/2,o.co);g.add(cab);
const wg=new THREE.CylinderGeometry(.42,.42,.3,10).rotateZ(Math.PI/2),wm=new THREE.MeshLambertMaterial({color:0x151515});
for(const sx of[-1,1])for(const sz of[-1,1]){const w=new THREE.Mesh(wg,wm);w.position.set(sx*o.w/2,.42,sz*o.l*.32);g.add(w)}
g.userData={body,orig:Float32Array.from(body.geometry.attributes.position.array),hits:0};scene.add(g);return g}
function place(g,x,z,h){const y=hAt(x,z),f=hAt(x+Math.sin(h)*2,z+Math.cos(h)*2),b=hAt(x-Math.sin(h)*2,z-Math.cos(h)*2);g.rotation.order='YXZ';g.position.set(x,y+.3,z);g.rotation.set(-Math.atan2(f-b,4),h,0)}
function dent(g,wp,amt){const u=g.userData;if(u.hits>=9)return;u.hits++;const b=u.body,p=b.geometry.attributes.position,l=g.worldToLocal(wp.clone());l.y-=b.position.y;
for(let i=0;i<p.count;i++){const x=p.getX(i),y=p.getY(i),z=p.getZ(i),d=Math.hypot(x-l.x,y-l.y,z-l.z);if(d<2.2){const f=(1-d/2.2)*amt;p.setXYZ(i,x*(1-f*.22)+(R()-.5)*f*.3,y*(1-f*.12)+(R()-.5)*f*.3,z*(1-f*.22)+(R()-.5)*f*.3)}}
p.needsUpdate=true}
function repair(g){const p=g.userData.body.geometry.attributes.position;p.array.set(g.userData.orig);p.needsUpdate=true;g.userData.hits=0}
const VAR=[
 {c:0xd64545,w:1.7,h:.7,l:3.6,ch:.6,cl:.55,co:-.1,sp:16},  // hatchback
 {c:0x3d6fd6,w:1.8,h:.7,l:4.4,ch:.6,cl:.5,co:-.2,sp:20},   // sedan
 {c:0xf2f2f2,w:2,h:1.3,l:4.6,ch:.7,cl:.4,co:1.3,sp:13},    // van
 {c:0xf2c230,w:1.9,h:.55,l:4.2,ch:.45,cl:.4,co:-.3,sp:27}, // sports
 {c:0x3a8a4a,w:2,h:.8,l:4.8,ch:.7,cl:.35,co:.9,sp:17}      // pickup
];
const npcs=[];
for(let k=0;k<10;k++){const v=VAR[k%5];npcs.push({g:mkCar(v),sp:v.sp,dir:k<5?1:-1,u:.08+k*.09,x:0,z:0})}
const pg=mkCar({c:0x1fa39a,w:1.8,h:.7,l:4.2,ch:.6,cl:.5,co:-.2});
const pl={x:0,z:0,h:0,v:0,cd:0};
function respawn(){const p=pathAt(0);pl.x=p.x-p.tz*2.6;pl.z=p.z+p.tx*2.6;pl.h=Math.atan2(p.tx,p.tz);pl.v=0;repair(pg)}
respawn();
// input
const K={};addEventListener('keydown',e=>{K[e.code]=1;if(e.code=='KeyR')respawn();if(/Arrow|Space/.test(e.code))e.preventDefault()});addEventListener('keyup',e=>K[e.code]=0);
function resize(){ren.setSize(innerWidth,innerHeight,false);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix()}
addEventListener('resize',resize);resize();
const spd=document.getElementById('spd'),dmg=document.getElementById('dmg'),cp=new THREE.Vector3(),tp=new THREE.Vector3();
let last=performance.now();
function frame(now){requestAnimationFrame(frame);const dt=Math.min(.05,(now-last)/1000);last=now;
  const up=K.KeyW||K.ArrowUp,dn=K.KeyS||K.ArrowDown,lf=K.KeyA||K.ArrowLeft,rt=K.KeyD||K.ArrowRight;
  let v=pl.v;
  if(up)v+=(v<0?40:24)*dt;if(dn)v-=(v>0?44:12)*dt;
  if(K.Space)v-=Math.sign(v)*Math.min(Math.abs(v),50*dt);
  v-=v*.25*dt;v-=Math.sign(v)*Math.min(Math.abs(v),3*dt);
  if(near(pl.x,pl.z).d>7)v-=v*Math.min(1,1.2*dt);
  v=cl(v,-10,48);
  pl.h+=((lf?1:0)-(rt?1:0))*dt*1.7*cl(v/8,-1,1)/(1+Math.abs(v)/40);
  pl.x+=Math.sin(pl.h)*v*dt;pl.z+=Math.cos(pl.h)*v*dt;pl.v=v;
  if(hAt(pl.x,pl.z)<.2)respawn();
  place(pg,pl.x,pl.z,pl.h);
  pl.cd-=dt;
  for(const n of npcs){n.u+=n.dir*n.sp/L*dt;const p=pathAt(n.u);n.x=p.x-p.tz*n.dir*2.6;n.z=p.z+p.tx*n.dir*2.6;place(n.g,n.x,n.z,Math.atan2(n.dir*p.tx,n.dir*p.tz));
    const dx=pl.x-n.x,dz=pl.z-n.z,d=Math.hypot(dx,dz);
    if(d<2.9&&pl.cd<=0){pl.cd=.6;pl.v*=.3;pl.x+=dx/d*.8;pl.z+=dz/d*.8;
      const ip=new THREE.Vector3((pl.x+n.x)/2,pg.position.y+1,(pl.z+n.z)/2);dent(pg,ip,.7+R()*.5);dent(n.g,ip,.7+R()*.5)}}
  // camera
  tp.set(pl.x-Math.sin(pl.h)*11,pg.position.y+5.5,pl.z-Math.cos(pl.h)*11);
  cam.position.lerp(tp,1-Math.exp(-4*dt));cam.position.y=Math.max(cam.position.y,hAt(cam.position.x,cam.position.z)+2);
  cp.set(pl.x+Math.sin(pl.h)*6,pg.position.y+1.5,pl.z+Math.cos(pl.h)*6);cam.lookAt(cp);
  spd.textContent=Math.round(Math.abs(v)*3.4);dmg.textContent=Math.min(100,pg.userData.hits*11);
  ren.render(scene,cam)}
cam.position.set(pl.x,10,pl.z-12);requestAnimationFrame(frame);
</script></body></html>
